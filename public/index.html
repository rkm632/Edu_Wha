<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdutaAI SaaS - WhatsApp Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .gradient-btn { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; }
        .gradient-btn:hover { background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%); }
        .tab-btn.active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- ==========================================
         1. LOGIN SCREEN
    =========================================== -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 bg-opacity-95">
        <div class="bg-white p-8 md:p-10 rounded-2xl shadow-2xl w-11/12 md:w-96 text-center">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-slate-800">EdutaAI Login</h2>
            <input type="text" id="loginUser" placeholder="Username" class="w-full px-4 py-3 mb-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="loginPass" placeholder="Password" class="w-full px-4 py-3 mb-6 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="doLogin()" class="w-full gradient-btn font-bold py-3 rounded-xl shadow-lg transition">Login to Dashboard</button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden font-medium"></p>
        </div>
    </div>

    <!-- ==========================================
         2. SIDEBAR (Responsive)
    =========================================== -->
    <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 hidden md:flex" id="sidebar">
        <div class="p-6 border-b border-slate-800 flex items-center gap-3">
            <i class="fa-brands fa-whatsapp text-green-400 text-2xl"></i>
            <h1 class="text-xl font-bold text-white">Eduta<span class="text-blue-400">AI</span></h1>
        </div>
        <div class="p-4 bg-slate-800 text-sm font-semibold text-center border-b border-slate-700">
            Role: <span id="user-role-badge" class="text-white uppercase">User</span>
        </div>
        <nav class="flex-1 p-4 space-y-2" id="nav-menu">
            <!-- Navigation links injected via JS based on role -->
        </nav>
        <button onclick="logout()" class="m-4 py-3 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-xl transition font-bold"><i class="fa-solid fa-power-off mr-2"></i> Logout</button>
    </aside>

    <!-- Mobile Header -->
    <div class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center z-20">
        <h1 class="text-lg font-bold">EdutaAI</h1>
        <button onclick="document.getElementById('sidebar').classList.toggle('hidden')" class="text-2xl"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- ==========================================
         3. MAIN CONTENT AREA
    =========================================== -->
    <main class="flex-1 bg-slate-50 overflow-y-auto p-4 md:p-8">
        
        <!-- ADMIN VIEW: User Management -->
        <div id="view-admin" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-slate-800 border-b pb-4">Master Admin Panel</h2>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-lg mb-4 text-blue-600"><i class="fa-solid fa-user-plus"></i> Create New Client Account</h3>
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="newUserName" placeholder="Client Username" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="password" id="newUserPass" placeholder="Client Password" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="createUser()" class="gradient-btn px-6 py-2 rounded-lg font-bold shadow">Create User</button>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-lg mb-4 text-red-600"><i class="fa-solid fa-user-minus"></i> Delete Client</h3>
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="delUserName" placeholder="Username to delete" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                    <button onclick="deleteUser()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-bold shadow">Delete User</button>
                </div>
            </div>
        </div>

        <!-- USER VIEW: Client Dashboard -->
        <div id="view-user" class="hidden space-y-6">
            
            <!-- Connection Status Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Your WhatsApp Engine</h2>
                    <p class="text-slate-500 text-sm mt-1">Connect device to start sending messages.</p>
                </div>
                <span id="wa-status-badge" class="px-4 py-2 bg-yellow-100 text-yellow-700 font-bold rounded-full text-sm border border-yellow-200">Checking...</span>
            </div>

            <!-- TABS -->
            <div class="flex gap-6 border-b border-slate-200 px-2 overflow-x-auto">
                <button onclick="openUserTab('connect')" id="tab-connect" class="tab-btn active pb-3 text-slate-500 font-medium whitespace-nowrap"><i class="fa-solid fa-link"></i> Connection</button>
                <button onclick="openUserTab('bulk')" id="tab-bulk" class="tab-btn pb-3 text-slate-500 font-medium whitespace-nowrap"><i class="fa-solid fa-paper-plane"></i> Bulk Sender</button>
                <button onclick="openUserTab('ai')" id="tab-ai" class="tab-btn pb-3 text-slate-500 font-medium whitespace-nowrap"><i class="fa-solid fa-robot"></i> AI Auto-Reply</button>
            </div>

            <!-- TAB 1: CONNECT -->
            <div id="content-connect" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="text-center p-6 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50">
                    <p class="font-bold text-slate-700 mb-2">Scan QR Code</p>
                    <div id="qrcode" class="flex justify-center bg-white p-2 rounded shadow inline-block"></div>
                </div>
                <div class="text-center p-6 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 flex flex-col justify-center">
                    <p class="font-bold text-slate-700 mb-4">Pair with Phone Number</p>
                    <input type="text" id="phoneCodeInput" placeholder="919876543210" class="w-full px-4 py-2 border rounded-lg mb-4 text-center">
                    <button onclick="getPairingCode()" class="bg-slate-800 text-white py-2 rounded-lg font-bold">Generate 8-Digit Code</button>
                    <p id="pair-code-display" class="mt-4 text-2xl font-black tracking-widest text-blue-600 hidden"></p>
                </div>
            </div>

            <!-- TAB 2: BULK SENDER -->
            <div id="content-bulk" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg text-slate-800">Bulk Message Engine</h3>
                    <label class="flex items-center gap-2 cursor-pointer bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                        <input type="checkbox" id="antiBanToggle" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" checked>
                        <span class="text-sm font-bold text-slate-700">Anti-Ban Safe Mode (Delay)</span>
                    </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Numbers (One per line with country code)</label>
                        <textarea id="bulkNumbers" rows="6" class="w-full px-4 py-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500" placeholder="919999999999&#10;918888888888"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Message Content</label>
                        <textarea id="bulkMessage" rows="6" class="w-full px-4 py-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500" placeholder="Hello, your library fees is due..."></textarea>
                    </div>
                </div>
                <button onclick="sendBulk()" class="w-full mt-6 gradient-btn font-bold py-3 rounded-xl shadow">🚀 Start Sending Campaign</button>
            </div>

            <!-- TAB 3: AI CHATBOT -->
            <div id="content-ai" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg text-slate-800">Personalized Business AI (Lead Gen)</h3>
                    <label class="flex items-center gap-2 cursor-pointer bg-green-50 px-3 py-1.5 rounded-lg border border-green-200">
                        <input type="checkbox" id="aiToggle" class="w-4 h-4 text-green-600 rounded focus:ring-green-500">
                        <span class="text-sm font-bold text-green-700">Enable Auto-Reply</span>
                    </label>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Select AI Provider</label>
                        <select id="aiProvider" class="w-full px-4 py-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500">
                            <option value="groq">Groq (Ultra-Fast)</option>
                            <option value="gemini">Google Gemini</option>
                            <option value="openai">ChatGPT (OpenAI)</option>
                            <option value="deepseek">DeepSeek</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">API Key</label>
                        <input type="password" id="aiKey" placeholder="sk-..." class="w-full px-4 py-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Business System Prompt (Train your AI)</label>
                        <textarea id="aiPrompt" rows="4" class="w-full px-4 py-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500" placeholder="You are an assistant for 'Eduta Library'. Our timing is 8 AM to 10 PM. Fees is Rs 500/month. Your goal is to collect user's name and phone number for leads."></textarea>
                    </div>
                    <button onclick="saveAISettings()" class="w-full gradient-btn font-bold py-3 rounded-xl shadow">Save AI Configuration</button>
                </div>
            </div>

        </div>
    </main>

<script>
    let token = localStorage.getItem('token');
    let role = localStorage.getItem('role');
    let username = localStorage.getItem('username');

    // Init Logic
    window.onload = () => {
        if(token) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-role-badge').innerText = role;
            setupNavigation();
        }
    }

    // --- Authentication ---
    async function doLogin() {
        let u = document.getElementById('loginUser').value;
        let p = document.getElementById('loginPass').value;
        try {
            let res = await fetch('/api/login', { method: 'POST', body: JSON.stringify({username: u, password: p}) });
            let data = await res.json();
            if(data.status === 'success') {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('username', u);
                window.location.reload();
            } else {
                let err = document.getElementById('login-error');
                err.innerText = data.message;
                err.classList.remove('hidden');
            }
        } catch(e) { alert("Server Error"); }
    }

    function logout() {
        localStorage.clear();
        window.location.reload();
    }

    function setupNavigation() {
        let nav = document.getElementById('nav-menu');
        if(role === 'admin') {
            document.getElementById('view-admin').classList.remove('hidden');
            nav.innerHTML = '<a href="#" class="block px-4 py-3 bg-blue-600 text-white rounded-lg font-bold"><i class="fa-solid fa-users mr-2"></i> Client Management</a>';
        } else {
            document.getElementById('view-user').classList.remove('hidden');
            nav.innerHTML = '<a href="#" class="block px-4 py-3 bg-blue-600 text-white rounded-lg font-bold"><i class="fa-solid fa-gauge mr-2"></i> Automation Dashboard</a>';
            // Start user status check
        }
    }

    // --- Admin Functions ---
    async function createUser() {
        let u = document.getElementById('newUserName').value;
        let p = document.getElementById('newUserPass').value;
        let res = await fetch('/api/admin/create-user', { method: 'POST', body: JSON.stringify({username: u, password: p}) });
        let data = await res.json();
        alert(data.message || data.error);
    }

    async function deleteUser() {
        let u = document.getElementById('delUserName').value;
        let res = await fetch('/api/admin/delete-user', { method: 'POST', body: JSON.stringify({username: u}) });
        let data = await res.json();
        alert(data.message || data.error);
    }

    // --- User Tab Logic ---
    function openUserTab(tab) {
        ['connect', 'bulk', 'ai'].forEach(t => {
            document.getElementById('tab-' + t).classList.remove('active');
            document.getElementById('content-' + t).classList.add('hidden');
        });
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('content-' + tab).classList.remove('hidden');
    }

    async function saveAISettings() {
        let payload = {
            username: username,
            ai_provider: document.getElementById('aiProvider').value,
            api_key: document.getElementById('aiKey').value,
            system_prompt: document.getElementById('aiPrompt').value,
            auto_reply: document.getElementById('aiToggle').checked
        };
        let res = await fetch('/api/ai/settings', { method: 'POST', body: JSON.stringify(payload) });
        let data = await res.json();
        alert(data.message);
    }
</script>
</body>
</html>
